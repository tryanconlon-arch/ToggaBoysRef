<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Togga Boys Ref — League History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=Barlow:wght@300;400;500;600&family=Bebas+Neue&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="fantrax_data.js"></script>
<script src="fantrax_historical.js"></script>
<style>
:root {
  --bg:        #0D0820;
  --surface:   #170E34;
  --surface2:  #221545;
  --surface3:  #2D1B5A;
  --purple:    #7F4975;
  --purple-l:  #A560A0;
  --green:     #00703C;
  --green-l:   #00A055;
  --text:      #F0EDF8;
  --muted:     #9B90BC;
  --dim:       #554A7C;
  --border:    rgba(127,73,117,0.22);
  --border-g:  rgba(0,112,60,0.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;line-height:1.6;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:'Barlow Semi Condensed',sans-serif;letter-spacing:-0.01em}
button{font-family:inherit;cursor:pointer}
select{font-family:'Barlow',sans-serif}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(13,8,32,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo{width:32px;height:32px;border-radius:7px;object-fit:cover}
.nav-title{font-family:'Barlow Semi Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:0.06em;color:var(--text);text-transform:uppercase}
.nav-links{display:flex;list-style:none;gap:0}
.nav-links a{display:block;padding:0 0.9rem;height:60px;line-height:60px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green-l);border-bottom-color:var(--green-l)}

/* LAYOUT */
section{padding:96px 0 72px}
.container{max-width:1160px;margin:0 auto;padding:0 2rem}
.s-label{font-family:'Barlow Semi Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--green);margin-bottom:0.5rem}
.s-title{font-size:clamp(2.4rem,5vw,3.8rem);font-weight:800;line-height:0.95;margin-bottom:0.75rem}
.s-sub{font-size:0.95rem;color:var(--muted);margin-bottom:2.5rem;max-width:500px}
.divider{height:1px;background:var(--border);margin:2.5rem 0}

/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;padding-top:60px;background:#F4F1E8}
.hero-stripe{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green);pointer-events:none}
.hero-ring{position:absolute;right:-12%;top:50%;transform:translateY(-50%);width:min(72vw,720px);height:min(72vw,720px);border-radius:50%;border:1.5px solid rgba(0,112,60,0.1);pointer-events:none}
.hero-ring::after{content:'';position:absolute;inset:80px;border-radius:50%;border:1px solid rgba(127,73,117,0.08)}
.hero-fade{position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.hero-content{position:relative;z-index:1}
.hero-est{font-family:'Jost',sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.28em;text-transform:uppercase;color:var(--green);margin-bottom:1.5rem;display:flex;align-items:center;gap:14px}
.hero-est::before{content:'';display:block;width:32px;height:2px;background:var(--green);flex-shrink:0}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(5rem,13vw,11rem);font-weight:400;line-height:0.88;letter-spacing:0.03em;color:#1A0A2E;margin-bottom:0.25em}
.hero-title em{color:var(--green);font-style:normal}
.hero-sub{font-family:'Jost',sans-serif;font-size:clamp(.9rem,1.8vw,1.1rem);color:#6B5E7A;font-weight:400;margin-bottom:2.5rem;letter-spacing:.01em;max-width:440px}
.hero-stats{display:flex;gap:0;margin-bottom:2.5rem;flex-wrap:wrap}
.hero-stat-item{padding-right:2.5rem;margin-right:2.5rem;border-right:1px solid rgba(26,10,46,0.14)}
.hero-stat-item:last-child{border-right:none;padding-right:0;margin-right:0}
.hero-stat-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,6vw,4.8rem);font-weight:400;line-height:1;color:#1A0A2E}
.hero-stat-lbl{font-family:'Jost',sans-serif;font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#9B8FAA;margin-top:3px}
.champ-badge{display:inline-flex;align-items:center;gap:10px;background:#1A0A2E;border:none;border-radius:4px;padding:10px 20px 10px 14px}
.champ-badge-dot{width:6px;height:6px;border-radius:50%;background:#6BDA9F;animation:pulse 2s ease infinite;flex-shrink:0}
.champ-badge-text{font-family:'Jost',sans-serif;font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,0.55)}
.champ-badge-name{font-family:'Jost',sans-serif;font-size:.76rem;font-weight:700;color:#6BDA9F}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* TABLES */
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.dt{width:100%;border-collapse:collapse;font-size:.875rem}
.dt th{font-family:'Barlow Semi Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer;user-select:none;white-space:nowrap;transition:color .2s}
.dt th:hover{color:var(--text)}
.dt th.sort-up::after{content:" ↑";color:var(--green)}
.dt th.sort-dn::after{content:" ↓";color:var(--green)}
.dt td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tbody tr:hover td{background:rgba(127,73,117,.05)}
.rank-num{font-family:'Barlow Semi Condensed',sans-serif;font-size:1.05rem;font-weight:800;color:var(--dim);min-width:32px;display:inline-block}
.rank-num.gold{color:#D4AF37}.rank-num.silver{color:#A8A9AD}.rank-num.bronze{color:#CD7F32}
.m-cell{display:flex;align-items:center;gap:9px}
.m-avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:.8rem;flex-shrink:0;color:#fff}
.m-team{font-size:.72rem;color:var(--muted);margin-top:1px}
.badge-champ{display:inline-block;background:rgba(0,112,60,.22);color:var(--green-l);font-size:.6rem;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:4px;text-transform:uppercase;margin-left:6px;white-space:nowrap}
.tier-pill{display:inline-block;font-family:'Barlow Semi Condensed',sans-serif;font-size:.62rem;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.tier-pill.tier-1{background:rgba(0,112,60,.22);color:var(--green-l);border:1px solid rgba(0,112,60,.45)}
.tier-pill.tier-2{background:rgba(120,120,120,.15);color:var(--muted);border:1px solid rgba(120,120,120,.35)}
.tier-pill.tier-3{background:rgba(180,80,40,.15);color:#d99a78;border:1px solid rgba(180,80,40,.35)}
.num-green{color:var(--green-l);font-weight:600}
.num-red{color:#E55;font-weight:500}

/* CHAMPION CARDS */
.champ-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:2.5rem;scrollbar-width:none}
.champ-row::-webkit-scrollbar{display:none}
.champ-card{flex-shrink:0;width:148px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:1.1rem 1rem;transition:border-color .2s,transform .2s;cursor:default}
.champ-card.active-champ{border-color:var(--green)}
.champ-card:hover{border-color:var(--purple-l);transform:translateY(-2px)}
.cc-yr{font-family:'Barlow Semi Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--green);text-transform:uppercase;margin-bottom:.4rem}
.cc-name{font-family:'Barlow Semi Condensed',sans-serif;font-size:1.15rem;font-weight:800;line-height:1.1;margin-bottom:.2rem}
.cc-team{font-size:.72rem;color:var(--muted);margin-bottom:.65rem}
.cc-rec{font-family:'Barlow Semi Condensed',sans-serif;font-size:.8rem;color:var(--dim)}
.cc-pf{font-size:.72rem;color:var(--muted);margin-top:3px}
.trophy-icon{font-size:1.4rem;margin-bottom:.5rem}

/* SEASON PILLS */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.pill{font-family:'Barlow Semi Condensed',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.05em;padding:6px 15px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.pill:hover{border-color:var(--purple-l);color:var(--text)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}

/* SEASON REVEAL */
.season-panel{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.season-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:2rem}
.stat-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.stat-block-num{font-family:'Barlow Semi Condensed',sans-serif;font-size:2rem;font-weight:800;line-height:1;margin-bottom:.2rem}
.stat-block-lbl{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* BRACKET */
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.b-round{flex-shrink:0;min-width:150px}
.b-lbl{font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:.8rem}
.b-match{background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.b-team{padding:8px 11px;font-family:'Barlow Semi Condensed',sans-serif;font-size:.82rem;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
.b-team:last-child{border-bottom:none}
.b-team.w{color:var(--green-l);font-weight:700}
.b-team.l{color:var(--dim)}
.b-score{font-weight:800}

/* RECORDS */
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.rec-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:1.4rem;transition:border-color .2s,transform .2s}
.rec-card:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 0 22px rgba(0,112,60,.12)}
.rec-icon{font-size:1.3rem;margin-bottom:.7rem;line-height:1}
.rec-lbl{font-size:.67rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:.6rem}
.rec-val{font-family:'Barlow Semi Condensed',sans-serif;font-size:2.3rem;font-weight:800;line-height:1;margin-bottom:.4rem}
.rec-holder{font-family:'Barlow Semi Condensed',sans-serif;font-size:.95rem;font-weight:700;color:var(--green-l);margin-bottom:.2rem}
.rec-ctx{font-size:.78rem;color:var(--muted)}
.rec-card.clickable{cursor:pointer}
.rec-card.expanded{border-color:var(--green);box-shadow:0 0 22px rgba(0,112,60,.18);grid-column:1/-1}
.rec-expand-hint{margin-top:.7rem;font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--green-l);text-transform:uppercase;opacity:.75}
.rec-card:hover .rec-expand-hint{opacity:1}
.rec-expand{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.rec-toggle{display:flex;gap:.4rem;margin-bottom:.85rem}
.rec-toggle-btn{font-family:'Barlow Semi Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .75rem;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.rec-toggle-btn:hover{color:var(--text);border-color:var(--green)}
.rec-toggle-btn.on{background:rgba(0,112,60,.18);border-color:var(--green);color:var(--green-l)}
.rec-top{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.rec-top li{display:grid;grid-template-columns:28px 1fr 1fr 1.6fr;gap:.6rem;align-items:baseline;padding:.45rem .55rem;border-radius:6px;font-size:.85rem}
.rec-top li:nth-child(odd){background:rgba(255,255,255,.018)}
.rec-top li:hover{background:rgba(0,112,60,.08)}
.rec-top-rank{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;color:var(--dim);text-align:right}
.rec-top li:first-child .rec-top-rank{color:#D4AF37}
.rec-top-val{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:1rem;color:var(--text);white-space:nowrap}
.rec-top-val em{font-style:normal;font-size:.7rem;font-weight:500;color:var(--muted);margin-left:3px}
.rec-top-holder{font-weight:600;color:var(--green-l)}
.rec-top-ctx{font-size:.78rem;color:var(--muted)}
.rec-top-mgr{font-weight:500;color:var(--dim);font-size:.8em;margin-left:2px}
@media(max-width:600px){.rec-top li{grid-template-columns:24px 1fr 1fr;gap:.4rem}.rec-top-ctx{grid-column:2/-1;font-size:.72rem;margin-top:2px}}

/* H2H */
.h2h-selectors{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;margin-bottom:1.75rem}
.h2h-vs{font-family:'Barlow Semi Condensed',sans-serif;font-size:1.3rem;font-weight:800;color:var(--dim);text-align:center}
.mgr-select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.mgr-select:focus{border-color:var(--purple-l)}
.h2h-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.h2h-big{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:1.5rem;text-align:center}
.h2h-rec{font-family:'Barlow Semi Condensed',sans-serif;font-size:2.6rem;font-weight:800;line-height:1;margin-bottom:.25rem}
.h2h-sub{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.h2h-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:1.4rem;margin-bottom:1.5rem}
.h2h-bar-track{height:7px;border-radius:100px;overflow:hidden;background:var(--surface2);margin:.75rem 0;display:flex}
.h2h-bar-fill{height:100%;transition:width .8s cubic-bezier(.25,.46,.45,.94)}
.h2h-bar-labels{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.h2h-matchups{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.h2h-matchup-row{padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:8px;align-items:center;border-bottom:1px solid rgba(255,255,255,.04);font-size:.83rem}
.h2h-matchup-row:last-child{border-bottom:none}
.h2h-season-wk{font-size:.7rem;color:var(--dim);min-width:60px}
.h2h-score{font-family:'Barlow Semi Condensed',sans-serif;font-size:.95rem;font-weight:700;text-align:center}
.h2h-w{color:var(--green-l)}.h2h-l{color:var(--dim)}
.h2h-dash{color:var(--dim);text-align:center}
.h2h-placeholder{text-align:center;padding:3rem 2rem;color:var(--muted);font-size:.9rem}

/* MANAGER CARDS */
.mgr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.mgr-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.4rem;cursor:pointer;transition:all .2s;position:relative}
.mgr-card:hover{border-color:var(--purple-l);transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.mgr-card-av{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:1.15rem;margin-bottom:.9rem;color:#fff}
.mgr-card-name{font-family:'Barlow Semi Condensed',sans-serif;font-size:1.25rem;font-weight:800;margin-bottom:2px}
.mgr-card-team{font-size:.75rem;color:var(--muted);margin-bottom:.9rem}
.mgr-stats-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ms-item{font-size:.72rem;color:var(--muted)}
.ms-val{font-family:'Barlow Semi Condensed',sans-serif;display:block;font-size:1.1rem;font-weight:700;color:var(--text);line-height:1.1;margin-bottom:2px}
.ribbon{position:absolute;top:10px;right:10px;background:var(--green);color:#fff;font-size:.58rem;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:4px;text-transform:uppercase}
.view-more{font-size:.72rem;color:var(--purple-l);margin-top:.9rem;font-weight:600;letter-spacing:.04em}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(8,4,20,.86);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);z-index:300;display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:mFade .2s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:740px;max-height:88vh;overflow-y:auto;animation:mSlide .28s cubic-bezier(.25,.46,.45,.94)}
@keyframes mSlide{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-hdr{padding:1.75rem 1.75rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-body{padding:1.75rem}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;line-height:1;transition:color .2s;padding:2px}
.modal-close:hover{color:var(--text)}
.modal-section{margin-bottom:2rem}
.modal-section-title{font-family:'Barlow Semi Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:1rem}
.career-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.career-num{font-family:'Barlow Semi Condensed',sans-serif;font-size:1.8rem;font-weight:800;line-height:1;margin-bottom:3px}
.career-lbl{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sig-block{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;font-size:.85rem;color:var(--muted);font-style:italic;line-height:1.5}
.sig-block strong{color:var(--text);font-style:normal}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:2.5rem 0}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.footer-copy{font-size:.8rem;color:var(--dim)}

/* SCROLL ANIMATIONS */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:100px}

/* UTILS */
.tw{white-space:nowrap}
.ta-r{text-align:right}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
@media(max-width:700px){.two-col{grid-template-columns:1fr}.h2h-selectors{grid-template-columns:1fr}.h2h-vs{display:none}.nav-links{display:none}.season-hero{grid-template-columns:1fr}.career-grid{grid-template-columns:1fr 1fr}}

/* ── FANTRAX LIVE DATA SECTIONS ─────────────────────────────────────────── */

/* Division badge */
.div-badge{display:inline-block;font-family:'Barlow Semi Condensed',sans-serif;font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-right:7px;flex-shrink:0}
.div-badge.d1{background:rgba(0,112,60,.18);color:var(--green-l)}
.div-badge.d2{background:rgba(127,73,117,.22);color:var(--purple-l)}
.div-badge.d3{background:rgba(75,108,183,.22);color:#7A9EF5}

/* Streak badge */
.streak-w{color:var(--green-l);font-weight:600}
.streak-l{color:#E55;font-weight:500}
.streak-d{color:var(--muted);font-weight:500}

/* Filter tabs (reused across sections) */
.ftabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.ftab{font-family:'Barlow Semi Condensed',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.05em;padding:6px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.ftab:hover{border-color:var(--purple-l);color:var(--text)}
.ftab.on{background:var(--green);border-color:var(--green);color:#fff}

/* Search input */
.search-wrap{position:relative;margin-bottom:1.25rem}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px 10px 38px;color:var(--text);font-size:.88rem;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--dim)}
.search-input:focus{border-color:var(--purple-l)}

/* Roster pos group label */
.pos-group-hd{font-family:'Barlow Semi Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--green);padding:10px 14px 6px;border-bottom:1px solid var(--border);background:var(--surface)}

/* Status badges for roster */
.status-act{color:var(--green-l);font-weight:600;font-size:.78rem}
.status-res{color:var(--muted);font-size:.78rem}
.status-ir{color:#E55;font-size:.78rem}

/* Avail badge for player pool */
.avail-fa{color:var(--green-l);font-size:.75rem;font-weight:600}
.avail-w{color:#F5A623;font-size:.75rem;font-weight:600}

/* Move type badges */
.move-badge{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.move-claim{background:rgba(0,112,60,.2);color:var(--green-l)}
.move-drop{background:rgba(229,85,85,.15);color:#E55}
.move-trade{background:rgba(127,73,117,.22);color:var(--purple-l)}
.move-waiver{background:rgba(245,166,35,.15);color:#F5A623}

/* Moves two-up leaderboards */
.moves-leaders{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:2rem}
.leader-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.leader-hd{font-family:'Barlow Semi Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2)}
.leader-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem}
.leader-row:last-child{border-bottom:none}
.leader-pos{font-family:'Barlow Semi Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.1em;color:var(--dim);min-width:28px}
.leader-cnt{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;color:var(--green-l)}

/* Trade event cards */
.trade-events{display:flex;flex-direction:column;gap:12px;margin-top:1.5rem}
.trade-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.trade-card-hd{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:'Barlow Semi Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trade-team-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.trade-team-row:last-child{border-bottom:none}
.trade-recv{font-family:'Barlow Semi Condensed',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:3px;min-width:48px}
.trade-players{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.trade-player-tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;background:rgba(127,73,117,.12);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.trade-player-tag .tp-pos{font-family:'Barlow Semi Condensed',sans-serif;font-size:.65rem;font-weight:700;color:var(--dim)}

/* Export date label */
.export-date{font-size:.72rem;color:var(--dim);margin-top:.5rem}

@media(max-width:700px){.moves-leaders{grid-template-columns:1fr}}

/* ─── CHATBOT ─────────────────────────────────────────────────── */
.cb-launch{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:1.6rem;border:none;box-shadow:0 6px 22px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06);cursor:pointer;z-index:1000;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.cb-launch:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 8px 26px rgba(0,112,60,.5)}
.cb-panel{position:fixed;right:24px;bottom:24px;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 32px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;z-index:1000}
.cb-head{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1rem;background:rgba(0,112,60,.15);border-bottom:1px solid var(--border);font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.04em}
.cb-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 8px;border-radius:4px}
.cb-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
.cb-body{flex:1;overflow-y:auto;padding:.85rem;display:flex;flex-direction:column;gap:.7rem;font-size:.88rem;line-height:1.5}
.cb-msg{max-width:88%;padding:.65rem .85rem;border-radius:11px;word-wrap:break-word}
.cb-msg.cb-user{align-self:flex-end;background:rgba(0,112,60,.22);border:1px solid rgba(0,112,60,.45);color:var(--text)}
.cb-msg.cb-assist{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text)}
.cb-text{white-space:pre-wrap}
.cb-text strong{color:var(--green-l);font-weight:700}
.cb-table-wrap{margin-top:.55rem;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.cb-table{width:100%;border-collapse:collapse;font-size:.82rem}
.cb-table th{background:rgba(0,112,60,.12);text-align:left;padding:.4rem .55rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.cb-table td{padding:.4rem .55rem;border-top:1px solid var(--border)}
.cb-table tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.cb-suggests{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
.cb-chip{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.78rem;padding:.4rem .7rem;border-radius:14px;cursor:pointer;transition:all .15s}
.cb-chip:hover{color:var(--text);border-color:var(--green);background:rgba(0,112,60,.1)}
.cb-input{display:flex;gap:.4rem;padding:.7rem;border-top:1px solid var(--border);background:var(--surface)}
.cb-input input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:.55rem .75rem;border-radius:8px;font-family:inherit;font-size:.88rem;outline:none}
.cb-input input:focus{border-color:var(--green)}
.cb-input button{background:var(--green);color:#fff;border:none;padding:.55rem 1rem;border-radius:8px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;cursor:pointer}
.cb-input button:hover{background:#005f33}
@media(max-width:480px){.cb-panel{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px)}}
</style>
</head>

// ─── DATA ───────────────────────────────────────────────────────────────────

const MANAGERS = HIST_MANAGERS.filter(m => m.has_name);
const SEASONS  = HIST_SEASONS;
const SEASON_STANDINGS = HIST_STANDINGS;
const RECORDS  = HIST_RECORDS;

// ─── UTILS ──────────────────────────────────────────────────────────────────

function mgr(id){return MANAGERS.find(m=>m.id===id)}
function initials(name){return name.split(/[\s']+/).map(p=>p[0]).join('').slice(0,2).toUpperCase()}
// Tier 1 (Premier League) or pre-tier era (tier=null) qualify for site-wide stats.
function isPlEligible(tier){return tier==null||tier===1}
function isPLRow(row){return !!row && isPlEligible(row.tier)}
// Strip leading '1-' / '2-' / '3-' from a team name string (defensive — most data is pre-cleaned by builder).
function cleanTeam(t){return (t==null?'':String(t)).replace(/^\s*[123]\s*[-\u2013]\s*/,'').trim()}
function tierLabel(tier){return tier===1?'Premier League':tier===2?'Championship':tier===3?'League One':''}
function tierShort(tier){return tier===1?'PL':tier===2?'CH':tier===3?'L1':''}

function computeAllTime(){
  const stats={};
  MANAGERS.forEach(m=>{stats[m.id]={wins:0,losses:0,draws:0,pf:0,pa:0,championships:m.championships.length,seasons:0}});
  SEASONS.forEach(yr=>{
    (SEASON_STANDINGS[yr]||[]).forEach(row=>{
      if(!isPLRow(row))return;          // PL-only / pre-tier for site-wide stats
      const s=stats[row.owner_id];
      if(!s)return;
      s.wins+=row.w; s.losses+=row.l; s.draws+=(row.d||0); s.pf+=row.pf; s.pa+=row.pa; s.seasons+=1;
    });
  });
  return MANAGERS.map(m=>({...m, ...stats[m.id],
    winPct:(stats[m.id].wins/(stats[m.id].wins+stats[m.id].losses+stats[m.id].draws)*100).toFixed(1),
    avgPF:(stats[m.id].pf/Math.max(stats[m.id].seasons,1)).toFixed(1),
  }));
}
const ALL_TIME = computeAllTime();

function getH2HData(m1id,m2id){
  const ids=[m1id,m2id].sort();
  const key=ids.join(':');
  const pair=HIST_H2H[key];
  if(!pair)return{wins:0,losses:0,pf:'0.0',pa:'0.0',rows:[]};
  const flip=m1id!==ids[0];
  const wins  =flip?pair.losses:pair.wins;
  const losses=flip?pair.wins:pair.losses;
  const pf    =flip?pair.pa:pair.pf;
  const pa    =flip?pair.pf:pair.pa;
  const rows=(pair.matches||[]).map(r=>{
    const sc1=flip?r.s2:r.s1;
    const sc2=flip?r.s1:r.s2;
    return{yr:r.year,wk:r.week,sc1:sc1.toFixed(2),sc2:sc2.toFixed(2),m1w:sc1>sc2};
  }).slice(0,8);
  return{wins,losses,pf:pf.toFixed(1),pa:pa.toFixed(1),rows};
}

function computeManagerCareer(mid){
  const seasons=[];
  SEASONS.forEach(yr=>{
    const row=(SEASON_STANDINGS[yr]||[]).find(s=>s.owner_id===mid);
    if(row) seasons.push({yr,...row});
  });
  return seasons;
}

// ─── HOOKS ──────────────────────────────────────────────────────────────────

function useCountUp(target,started,decimals=0,dur=1800){
  const [val,setVal]=React.useState(0);
  React.useEffect(()=>{
    if(!started){setVal(0);return}
    let start=null;
    const step=ts=>{
      if(!start)start=ts;
      const p=Math.min((ts-start)/dur,1);
      const ease=1-Math.pow(1-p,3);
      setVal(+(ease*target).toFixed(decimals));
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[target,started]);
  return val;
}

function useInView(ref,threshold=0.15){
  const[inView,setInView]=React.useState(false);
  React.useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setInView(true)},{threshold});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return inView;
}

function useActiveSection(ids){
  const[active,setActive]=React.useState(ids[0]);
  React.useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting)setActive(e.target.id)});
    },{rootMargin:'-40% 0px -55% 0px'});
    ids.forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el)});
    return()=>obs.disconnect();
  },[]);
  return active;
}

function SortableTable({data,columns,getKey}){
  const[sortCol,setSortCol]=React.useState(null);
  const[sortDir,setSortDir]=React.useState('desc');

    if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortCol(col);setSortDir('desc')}
  };
  const sorted=sortCol?[...data].sort((a,b)=>{
    const v=a[sortCol]>b[sortCol]?1:-1;
    return sortDir==='asc'?v:-v;
  }):data;
  return(
    <div className="table-wrap">
      <table className="dt">
        <thead>
          <tr>{columns.map(c=>(
            <th key={c.key} onClick={()=>handleSort(c.key)}
              className={sortCol===c.key?(sortDir==='asc'?'sort-up':'sort-dn'):''}
            >{c.label}</th>
          ))}</tr>
        </thead>
        <tbody>{sorted.map(row=>getKey(row))}</tbody>
      </table>
    </div>
  );
}

// ─── LIVE DATA HELPERS ───────────────────────────────────────────────────────

function divClass(div){return div===1?'d1':div===2?'d2':div===3?'d3':''}

function DivBadge({div}){
  if(!div)return null;
  return <span className={`div-badge ${divClass(div)}`}>D{div}</span>;
}

function streakClass(streak){
  if(!streak)return '';
  const s=streak.toUpperCase();
  if(s.includes('(W)'))return 'streak-w';
  if(s.includes('(L)'))return 'streak-l';
  return 'streak-d';
}

function LiveStandings(){
  const [div,setDiv]=React.useState(0);
  const [sortCol,setSortCol]=React.useState('rk');
  const [sortDir,setSortDir]=React.useState('asc');

  const data=(typeof FANTRAX_STANDINGS!=='undefined')?FANTRAX_STANDINGS:[];

  const filtered=div===0?data:data.filter(r=>r.div===div);
  const sorted=[...filtered].sort((a,b)=>{
    const av=a[sortCol],bv=b[sortCol];
    const v=av>bv?1:av<bv?-1:0;
    return sortDir==='asc'?v:-v;
  });

  const handleSort=col=>{
    if(col===sortCol)setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortCol(col);setSortDir(col==='rk'||col==='w'||col==='pts'?'asc':'desc')}
  };
  const thCls=col=>sortCol===col?(sortDir==='asc'?'sort-up':'sort-dn'):'';

  return(
    <section id="standings">
      <div className="container">
        <div className="s-label">Live Data · GW37</div>
        <h2 className="s-title">Current Standings</h2>
        <p className="s-sub">Full league table — all three divisions.</p>
        <p className="export-date">Exported {FANTRAX_EXPORT_DATE}</p>

        <div className="ftabs" style={{marginTop:'1.25rem'}}>
          {[[0,'All'],[1,'Division 1'],[2,'Division 2'],[3,'Division 3']].map(([v,l])=>(
            <button key={v} className={`ftab${div===v?' on':''}`} onClick={()=>setDiv(v)}>{l}</button>
          ))}
        </div>

        <div className="table-wrap">
          <table className="dt">
            <thead>
              <tr>
                <th onClick={()=>handleSort('rk')} className={thCls('rk')}>Rk</th>
                <th>Team</th>
                <th onClick={()=>handleSort('w')} className={thCls('w')}>W</th>
                <th>D</th>
                <th>L</th>
                <th onClick={()=>handleSort('pts')} className={thCls('pts')}>Pts</th>
                <th onClick={()=>handleSort('fptsF')} className={thCls('fptsF')}>FPts For</th>
                <th onClick={()=>handleSort('fptsA')} className={thCls('fptsA')}>FPts Ag</th>
                <th>Streak</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(r=>(
                <tr key={r.team}>
                  <td><span className={`rank-num${r.rk===1?' gold':r.rk===2?' silver':r.rk===3?' bronze':''}`}>{r.rk}</span></td>
                  <td>
                    <span className="m-cell">
                      <DivBadge div={r.div}/>
                      <span>{r.name}</span>
                    </span>
                  </td>
                  <td className="num-green">{r.w}</td>
                  <td style={{color:'var(--muted)'}}>{r.d}</td>
                  <td style={{color:'var(--dim)'}}>{r.l}</td>
                  <td style={{fontFamily:'Barlow Semi Condensed,sans-serif',fontWeight:800}}>{r.pts}</td>
                  <td className="num-green">{r.fptsF.toFixed(1)}</td>
                  <td style={{color:'var(--muted)'}}>{r.fptsA.toFixed(1)}</td>
                  <td className={streakClass(r.streak)}>{r.streak}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  );
}

function MyRoster(){
  const [tab,setTab]=React.useState('active');
  const all=(typeof FANTRAX_ROSTER!=='undefined')?FANTRAX_ROSTER:[];

  const byStatus=tab==='active'
    ?all.filter(p=>p.status==='Act')
    :all.filter(p=>p.status==='Res'||p.status==='IR');

  const posOrder=['G','D','M','F'];
  const grouped=posOrder.reduce((acc,pos)=>{
    const g=byStatus.filter(p=>p.pos===pos);
    if(g.length)acc.push({pos,players:g});
    return acc;
  },[]);

  const statusEl=s=>{
    if(s==='Act')return <span className="status-act">Active</span>;
    if(s==='Res')return <span className="status-res">Reserve</span>;
    if(s==='IR')return <span className="status-ir">IR</span>;
    return <span>{s}</span>;
  };
  const posLabel={'G':'GK','D':'DEF','M':'MID','F':'FWD'};

  return(
    <section id="roster">
      <div className="container">
        <div className="s-label">My Team</div>
        <h2 className="s-title">Current Roster</h2>
        <p className="s-sub">Active squad and reserves.</p>

        <div className="ftabs">
          <button className={`ftab${tab==='active'?' on':''}`} onClick={()=>setTab('active')}>Active</button>
          <button className={`ftab${tab==='bench'?' on':''}`} onClick={()=>setTab('bench')}>Reserve / IR</button>
        </div>

        <div className="table-wrap">
          <table className="dt" style={{tableLayout:'fixed'}}>
            <thead>
              <tr>
                <th style={{width:'30%'}}>Player</th>
                <th style={{width:'8%'}}>Pos</th>
                <th style={{width:'8%'}}>Team</th>
                <th style={{width:'10%'}}>Status</th>
                <th style={{width:'22%'}}>Next Match</th>
                <th style={{width:'10%'}}>FPts</th>
                <th style={{width:'8%'}}>FP/G</th>
                <th style={{width:'4%'}}>GP</th>
              </tr>
            </thead>
            <tbody>
              {grouped.map(({pos,players})=>(
                <React.Fragment key={pos}>
                  <tr><td colSpan={8} className="pos-group-hd">{posLabel[pos]||pos}</td></tr>
                  {players.map(p=>(
                    <tr key={p.player}>
                      <td style={{fontWeight:600}}>{p.player}</td>
                      <td style={{color:'var(--muted)',fontSize:'.78rem'}}>{p.pos}</td>
                      <td style={{color:'var(--muted)',fontSize:'.78rem'}}>{p.team}</td>
                      <td>{statusEl(p.status)}</td>
                      <td style={{fontSize:'.78rem',color:'var(--muted)'}}>{p.opponent||'—'}</td>
                      <td className="num-green">{p.fpts.toFixed(2)}</td>
                      <td>{p.fpg.toFixed(2)}</td>
                      <td style={{color:'var(--dim)'}}>{p.gp}</td>
                    </tr>
                  ))}
                </React.Fragment>
              ))}
              {grouped.length===0&&(
                <tr><td colSpan={8} style={{textAlign:'center',color:'var(--dim)',padding:'2rem'}}>No players in this group.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  );
}

function PlayerPool(){

  const filtered=data.filter(p=>{
    if(pos!=='All'&&p.pos!==pos)return false;
    if(avail!=='All'&&!p.status.startsWith(avail))return false;
    if(query&&!p.player.toLowerCase().includes(query.toLowerCase()))return false;

  const availEl=s=>{
    if(s==='FA')return <span className="avail-fa">FA</span>;
    if(s.startsWith('W'))return <span className="avail-w">W</span>;

            <button key={p} className={`ftab${pos===p?' on':''}`} onClick={()=>setPos(p)}>{p==='All'?'All Pos':p}</button>
          ))}
        </div>

        <div className="ftabs" style={{marginTop:'-0.5rem'}}>
          {['All','FA','W'].map(a=>(
            <button key={a} className={`ftab${avail===a?' on':''}`} onClick={()=>setAvail(a)}>
              {a==='All'?'All':a==='FA'?'Free Agents':'Waivers'}

        <div className="table-wrap">
          <table className="dt">

                <th>Team</th>

const QA = (() => {
  // Normalize: lowercase, collapse punctuation/whitespace.
  const normalize = (s) => (s || "").toLowerCase().replace(/[^\w%\s]/g, " ").replace(/\s+/g, " ").trim();

  // Stat synonym → canonical key, scope ('manager'|'player_of'|'player_gk'|'team_record').
  const STAT_DICT = [
    // Manager-level (computed from ALL_TIME or HIST_MANAGERS)
    { keys: ["championship", "championships", "title", "titles", "trophy", "trophies", "ring", "rings"], canon: "championships", scope: "manager" },
    { keys: ["points for", "career points", "total points", "most points", "by points"], canon: "pf", scope: "manager" },
    { keys: ["win rate", "winning percentage", "win pct", "win%", "winning %", "win percent"], canon: "winPct", scope: "manager" },
    { keys: ["wins", "career wins", "victories"], canon: "wins", scope: "manager" },
    { keys: ["losses", "career losses", "defeats"], canon: "losses", scope: "manager" },
    { keys: ["seasons", "years played", "seasons played"], canon: "seasons", scope: "manager" },
    // Player-level — outfield stats
    { keys: ["goal", "goals", "scored", "scoring"], canon: "G", scope: "player_of" },
    { keys: ["assist", "assists"], canon: "A", scope: "player_of" },
    { keys: ["key pass", "key passes", "kp"], canon: "KP", scope: "player_of" },
    { keys: ["yellow card", "yellow cards", "yellows", "bookings"], canon: "YC", scope: "player_of" },
    { keys: ["red card", "red cards", "reds", "sent off"], canon: "RC", scope: "player_of" },
    { keys: ["shots on target", "sot", "shots"], canon: "SOT", scope: "player_of" },
    { keys: ["tackles won", "tackles", "tkw"], canon: "TkW", scope: "player_of" },
    { keys: ["clearances", "clr"], canon: "CLR", scope: "player_of" },
    { keys: ["interceptions", "int"], canon: "Int", scope: "player_of" },
    { keys: ["aerials won", "aerials", "aer"], canon: "AER", scope: "player_of" },
    // Player-level — goalkeeper stats
    { keys: ["saves", "sv"], canon: "Sv", scope: "player_gk" },
    { keys: ["goals allowed", "goals conceded", "ga"], canon: "GA", scope: "player_gk" },
    { keys: ["clean sheet", "clean sheets", "cs", "mcs"], canon: "CS", scope: "player_gk" },
    { keys: ["penalty save", "penalty saves", "pks"], canon: "PKS", scope: "player_gk" },
    // Generic "fantasy points" / "scorer" — could be either player or manager scope; we'll disambiguate.
    { keys: ["fantasy point", "fantasy points", "fpts", "top scorer", "highest scorer", "leading scorer", "scorer", "scorers"], canon: "FPts", scope: "player_of" },
    // Team-level records (map to HIST_RECORDS entries)
    { keys: ["biggest blowout", "biggest win margin", "biggest margin", "blowout"], canon: "rec:Biggest Win Margin", scope: "team_record" },
    { keys: ["longest winning streak", "longest win streak", "win streak"], canon: "rec:Longest Winning Streak", scope: "team_record" },
    { keys: ["longest losing streak", "lose streak", "losing streak"], canon: "rec:Longest Losing Streak", scope: "team_record" },
    { keys: ["highest single-week", "highest single week", "best single week", "biggest single week"], canon: "rec:Highest Single-Week Score", scope: "team_record" },
    { keys: ["lowest single-week", "lowest single week", "worst single week"], canon: "rec:Lowest Single-Week Score", scope: "team_record" },
    { keys: ["most points in a season", "most points season"], canon: "rec:Most Points in a Season", scope: "team_record" },
    { keys: ["fewest points in a season", "fewest points season"], canon: "rec:Fewest Points in a Season", scope: "team_record" },
    { keys: ["best regular season", "best record"], canon: "rec:Best Regular Season Record", scope: "team_record" },
    { keys: ["all-time win rate", "all time win rate"], canon: "rec:All-Time Win Rate", scope: "team_record" },
    { keys: ["most transactions", "most moves", "most adds"], canon: "rec:Most Transactions in a Season", scope: "team_record" },
  ];

  const findStat = (text) => {
    // Longest match first; word-boundary to avoid 'points' matching 'int' inside.
    const escape = (s) => s.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&");
    const sorted = STAT_DICT.flatMap(e => e.keys.map(k => ({ k, ...e })))
                            .sort((a, b) => b.k.length - a.k.length);
    for (const entry of sorted) {
      const re = new RegExp("\\b" + escape(entry.k) + "\\b");
      if (re.test(text)) return entry;
    }
    return null;
  };

  // Year extraction. Supports 2018-2026, plus "last year", "this year", "all time"/"ever"/"career"/"history".
  const findYear = (text) => {
    if (/\b(all[- ]?time|career|ever|history|all years)\b/.test(text)) return { mode: "all" };
    if (/\b(this year|this season)\b/.test(text)) return { year: 2024, mode: "single" };
    if (/\b(last year|last season)\b/.test(text)) return { year: 2023, mode: "single" };
    const m = text.match(/\b(20\d{2})\b/);
    if (m) {
      let y = parseInt(m[1], 10);
      // Accept ranges 2018-2024 (we only have data through 2024-25 season).
      if (y >= 2018 && y <= 2024) return { year: y, mode: "single" };
    }
    return null;
  };

  // Manager mentions — fuzzy on the `name` field.
  const allManagers = () => (typeof MANAGERS !== "undefined" ? MANAGERS : []);
  const findManagers = (text) => {
    const out = [];
    for (const m of allManagers()) {
      const name = (m.name || "").toLowerCase();
      if (!name) continue;
      // Word-boundary match against the manager's display name.
      const escaped = name.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&");
      const re = new RegExp("\\b" + escaped + "\\b", "i");
      if (re.test(text)) out.push(m);
    }
    return out;
  };

  // Superlative direction.
  const findDirection = (text) => {
    if (/\b(most|highest|top|best|leading|leader|biggest|longest|greatest|all-time leader)\b/.test(text)) return "desc";
    if (/\b(least|fewest|lowest|worst|smallest|shortest)\b/.test(text)) return "asc";
    return null;
  };

  // Detect single-week intent.
  const isWeeklyContext = (text) => /\b(single[- ]?week|in a game|in a gameweek|biggest game|single game)\b/.test(text);

  // ── HANDLERS ────────────────────────────────────────────────────────────────

  const fmtNum = (v, dp = 0) => {
    if (typeof v !== "number") v = parseFloat(v);
    if (!isFinite(v)) return "—";
    return dp > 0 ? v.toFixed(dp) : Math.round(v).toString();
  };

  const sourceAllTime = () => (typeof ALL_TIME !== "undefined" ? ALL_TIME : []);

  // 1. Manager leaderboard.
  function answerManagerLeaderboard(stat, direction) {
    const at = sourceAllTime();
    if (!at.length) return { text: "No manager data loaded." };
    const dir = direction === "asc" ? 1 : -1;
    const key = stat.canon;
    const valOf = (m) => {
      if (key === "championships") return m.championships;
      if (key === "pf") return m.pf;
      if (key === "winPct") return parseFloat(m.winPct);
      if (key === "wins") return m.wins;
      if (key === "losses") return m.losses;
      if (key === "seasons") return m.seasons;
      return 0;
    };
    const labels = { championships: "Championships", pf: "Career PF", winPct: "Win %", wins: "Career Wins", losses: "Career Losses", seasons: "Seasons" };
    const sorted = [...at].sort((a, b) => dir * (valOf(a) - valOf(b))).slice(0, 5);
    const dpFor = { pf: 1, winPct: 1 };
    const rows = sorted.map(m => ({ name: m.name, value: fmtNum(valOf(m), dpFor[key] || 0) + (key === "winPct" ? "%" : "") }));
    const lead = sorted[0];
    const head = `${dir < 0 ? "Most" : "Fewest"} ${labels[key]}: **${lead.name}** with ${rows[0].value}.`;
    return { text: head, table: rows, tableHead: ["Manager", labels[key]] };
  }

  // 2. Manager career profile.
  function answerManagerCareer(mgr) {
    const at = sourceAllTime().find(m => m.id === mgr.id);
    if (!at) return { text: `No career data for ${mgr.name}.` };
    const lines = [
      `**${at.name}** — career snapshot`,
      `Record: ${at.wins}–${at.losses}${at.draws ? `–${at.draws}` : ""}  (${at.winPct}%)`,
      `Career PF: ${fmtNum(at.pf, 1)}  ·  Avg PF/season: ${at.avgPF}`,
      `Championships: ${at.championships}${mgr.championships && mgr.championships.length ? "  (years: " + mgr.championships.join(", ") + ")" : ""}`,
      `PL/pre-tier seasons: ${at.seasons}`,
    ];
    return { text: lines.join("\n") };
  }

  // 3. Manager best/worst season.
  function answerManagerBestSeason(mgr, direction = "desc") {
    if (typeof SEASON_STANDINGS === "undefined") return { text: "No season data." };
    const rows = [];
    Object.keys(SEASON_STANDINGS).forEach(yr => {
      const r = (SEASON_STANDINGS[yr] || []).find(s => s.owner_id === mgr.id);
      if (r && isPLRow(r)) rows.push({ yr, ...r });
    });
    if (!rows.length) return { text: `${mgr.name} has no qualifying PL seasons.` };
    rows.sort((a, b) => (direction === "asc" ? 1 : -1) * (a.pf - b.pf));
    const top = rows[0];
    const label = direction === "asc" ? "worst" : "best";
    return { text: `**${mgr.name}**'s ${label} season: **${top.yr}** — ${top.w}-${top.l}, ${fmtNum(top.pf, 1)} PF, finished ${top.tier_rank || top.rank}${top.champion ? " 🏆" : ""}.` };
  }

  // 4. Manager championships list.
  function answerManagerChampionships(mgr) {
    const yrs = (mgr.championships || []);
    if (!yrs.length) return { text: `${mgr.name} hasn't won a championship yet.` };
    return { text: `${mgr.name} has won **${yrs.length}** championship${yrs.length === 1 ? "" : "s"} — ${yrs.join(", ")}.` };
  }

  // 5. Season champion.
  function answerSeasonChampion(year) {
    if (typeof SEASON_STANDINGS === "undefined") return { text: "No season data." };
    const rows = SEASON_STANDINGS[year] || [];
    const champ = rows.find(r => r.champion);
    if (!champ) return { text: `No champion data found for ${year}.` };
    const m = mgr(champ.owner_id) || { name: champ.team_name || "—" };
    return { text: `**${year}** champion: **${m.name}** (${champ.team_name}) — ${champ.w}-${champ.l}, ${fmtNum(champ.pf, 1)} PF.` };
  }

  // 6. Manager finish in a specific year.
  function answerManagerSeason(mgr, year) {
    if (typeof SEASON_STANDINGS === "undefined") return { text: "No season data." };
    const row = (SEASON_STANDINGS[year] || []).find(r => r.owner_id === mgr.id);
    if (!row) return { text: `${mgr.name} didn't play in ${year}.` };
    const tier = row.tier === 1 ? "Premier League" : row.tier === 2 ? "Championship" : row.tier === 3 ? "League One" : null;
    const finish = row.tier_rank || row.rank;
    return { text: `${mgr.name} finished **${finish}${ordinalSuffix(finish)}** in ${year}${tier ? ` (${tier})` : ""} — ${row.w}-${row.l}, ${fmtNum(row.pf, 1)} PF${row.champion ? " 🏆" : ""}.` };
  }

  // 7. Season top scorer (PF leader for that year).
  function answerSeasonTopScorer(year) {
    if (typeof SEASON_STANDINGS === "undefined") return { text: "No season data." };
    const rows = (SEASON_STANDINGS[year] || []).filter(isPLRow);
    if (!rows.length) return { text: `No qualifying rows for ${year}.` };
    const sorted = [...rows].sort((a, b) => b.pf - a.pf).slice(0, 3);
    const top = sorted[0];
    const tm = mgr(top.owner_id) || { name: top.team_name };
    const head = `Top PL scorer of ${year}: **${tm.name}** with ${fmtNum(top.pf, 1)} PF.`;
    const table = sorted.map((r, i) => ({ rank: i + 1, name: (mgr(r.owner_id) || { name: r.team_name }).name, value: fmtNum(r.pf, 1) }));
    return { text: head, table, tableHead: ["Rank", "Manager", "PF"] };
  }

  // 8. H2H.
  function answerH2H(a, b) {
    if (typeof HIST_H2H === "undefined") return { text: "No H2H data." };
    const ids = [a.id, b.id].sort();
    const pair = HIST_H2H[ids.join(":")];
    if (!pair) return { text: `${a.name} and ${b.name} have no recorded matchups.` };
    const flip = a.id !== ids[0];
    const wins = flip ? pair.losses : pair.wins;
    const losses = flip ? pair.wins : pair.losses;
    const pf = flip ? pair.pa : pair.pf;
    const pa = flip ? pair.pf : pair.pa;
    const verb = wins > losses ? "leads" : wins < losses ? "trails" : "is tied with";
    return { text: `**${a.name}** ${verb} **${b.name}** ${wins}-${losses} all-time. PF: ${fmtNum(pf, 1)} vs ${fmtNum(pa, 1)}.` };
  }

  // 9-10. Player leader (season-long).
  function answerPlayerLeader(stat, year) {
    const split = stat.scope === "player_gk" ? "GK" : "OF";
    const all = (typeof window !== "undefined" && window[`HIST_PLAYER_RECORDS_${split}`]) ||
                (split === "OF" ? (typeof HIST_PLAYER_RECORDS_OF !== "undefined" ? HIST_PLAYER_RECORDS_OF : []) :
                                  (typeof HIST_PLAYER_RECORDS_GK !== "undefined" ? HIST_PLAYER_RECORDS_GK : []));
    const rec = all.find(r => r.key === stat.canon);
    if (!rec) return { text: `No record category for ${stat.canon}.` };
    let entries = rec.top_all;
    if (year) entries = entries.filter(e => (e.ctx || "").includes(String(year)));
    if (!entries.length) return { text: `No ${stat.canon} entries${year ? ` in ${year}` : ""}.` };
    const top = entries.slice(0, 5);
    const head = `Top **${rec.label}**${year ? ` in ${year}` : " all-time"}: **${top[0].holder}** with ${top[0].value}${top[0].unit ? top[0].unit : ""}.`;
    const table = top.map((e, i) => ({ rank: i + 1, name: e.holder, value: e.value + (e.unit || ""), ctx: e.ctx }));
    return { text: head, table, tableHead: ["#", "Player", rec.label, "When"] };
  }

  // 11. Single-week player record.
  function answerPlayerWeekly(stat) {
    const split = stat.scope === "player_gk" ? "GK" : "OF";
    const all = split === "OF" ? (typeof HIST_PLAYER_RECORDS_OF_WEEKLY !== "undefined" ? HIST_PLAYER_RECORDS_OF_WEEKLY : []) :
                                 (typeof HIST_PLAYER_RECORDS_GK_WEEKLY !== "undefined" ? HIST_PLAYER_RECORDS_GK_WEEKLY : []);
    const rec = all.find(r => r.key === stat.canon);
    if (!rec) return { text: `No weekly record for ${stat.canon}.` };
    const top = rec.top_all.slice(0, 5);
    if (!top.length) return { text: `No data for single-week ${rec.label}.` };
    const head = `Best single-week **${rec.label}**: **${top[0].holder}** with ${top[0].value}${top[0].unit || ""} (${top[0].ctx}).`;
    const table = top.map((e, i) => ({ rank: i + 1, name: e.holder, value: e.value + (e.unit || ""), ctx: e.ctx }));
    return { text: head, table, tableHead: ["#", "Player", rec.label, "When"] };
  }

  // 12. League records (team-level via HIST_RECORDS).
  function answerTeamRecord(stat) {
    if (typeof RECORDS === "undefined") return { text: "No records data." };
    const label = stat.canon.replace(/^rec:/, "");
    const rec = RECORDS.find(r => r.label === label);
    if (!rec) return { text: `No record card for "${label}".` };
    const top = (rec.top_all || []).slice(0, 5);
    const head = `**${rec.label}**: ${rec.value}${rec.unit ? rec.unit : ""} — ${rec.holder} (${rec.ctx}).`;
    if (!top.length) return { text: head };
    const table = top.map((e, i) => ({ rank: i + 1, name: e.holder, value: e.value + (e.unit || ""), ctx: e.ctx }));
    return { text: head, table, tableHead: ["#", "Holder", rec.label, "When"] };
  }

  // Fallback.
  function fallback(text) {
    const ex = [
      '"Who has the most championships?"',
      '"Tell me about Laeka"',
      '"Who won 2023?"',
      '"Most goals in 2024?"',
      '"Biggest single-week score?"',
      '"Laeka vs Will"',
    ];
    return { text: "I can't answer that yet. Try things like:\n\n" + ex.join("\n") };
  }

  function ordinalSuffix(n) {
    const s = ["th", "st", "nd", "rd"]; const v = n % 100;
    return (s[(v - 20) % 10] || s[v] || s[0]);
  }

  // ── ROUTING ─────────────────────────────────────────────────────────────────
  function parse(question) {
    const text = normalize(question);
    if (!text) return { text: "Ask me something about the league." };

    const managers = findManagers(text);
    const year = findYear(text);
    const stat = findStat(text);
    const direction = findDirection(text);
    const weekly = isWeeklyContext(text);

    // H2H: two managers + "vs"/"against"/"versus" OR just two managers.
    if (managers.length >= 2 && (/\bvs\b|versus|against/.test(text) || true)) {
      if (managers.length >= 2) return answerH2H(managers[0], managers[1]);
    }

    // Champion of a year.
    if (year && year.mode === "single" && /\b(champion|won|winner|win\b|champ\b)\b/.test(text) && !stat) {
      return answerSeasonChampion(year.year);
    }

    // Top scorer of a year (no manager mentioned, year + scoring/points + superlative).
    if (year && year.mode === "single" && !managers.length && stat && stat.canon === "FPts" && direction === "desc") {
      return answerSeasonTopScorer(year.year);
    }

    // Player records (player_of / player_gk scope).
    if (stat && (stat.scope === "player_of" || stat.scope === "player_gk")) {
      if (weekly) return answerPlayerWeekly(stat);
      const y = year && year.mode === "single" ? year.year : null;
      return answerPlayerLeader(stat, y);
    }

    // Team-level league records.
    if (stat && stat.scope === "team_record") return answerTeamRecord(stat);

    // Manager-specific intents (one manager named).
    if (managers.length === 1) {
      const m = managers[0];
      // Championship list?
      if (/championship|title|trophy|year.*\b(won|win)\b|when.*\b(won|win)\b|\b(won|win)\b.*championship|titles? won/.test(text)) {
        return answerManagerChampionships(m);
      }
      // Best/worst season?
      if (/best season|worst season|top season|best year/.test(text)) {
        return answerManagerBestSeason(m, direction === "asc" ? "asc" : "desc");
      }
      // Specific year for this manager?
      if (year && year.mode === "single") {
        return answerManagerSeason(m, year.year);
      }
      // Otherwise: career profile.
      return answerManagerCareer(m);
    }

    // Manager leaderboard (stat=manager scope, no specific manager).
    if (stat && stat.scope === "manager") {
      return answerManagerLeaderboard(stat, direction || "desc");
    }

    return fallback(text);
  }

  return { parse };
})();


function Chatbot() {
  const [open, setOpen] = React.useState(false);
  const [messages, setMessages] = React.useState([
    { role: "assistant", text: "Hi! Ask me anything about the league. Try: \"Who has the most championships?\" or \"Most goals in 2024?\"" }
  ]);
  const [input, setInput] = React.useState("");
  const scrollRef = React.useRef(null);

  const examples = [
    "Who has the most championships?",
    "Tell me about Laeka",
    "Who won 2023?",
    "Most goals in 2024?",
    "Biggest single-week score?",
    "Laeka vs Will",
  ];

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  const ask = (q) => {
    const trimmed = (q || input).trim();
    if (!trimmed) return;
    setMessages(prev => [...prev, { role: "user", text: trimmed }]);
    setInput("");
    setTimeout(() => {
      const ans = QA.parse(trimmed);
      setMessages(prev => [...prev, { role: "assistant", text: ans.text, table: ans.table, tableHead: ans.tableHead }]);
    }, 180);
  };

  const renderBubble = (m, i) => {
    const cls = m.role === "user" ? "cb-user" : "cb-assist";
    return (
      <div key={i} className={`cb-msg ${cls}`}>
        <div className="cb-text">{m.text.split("\n").map((line, j) => (
          <div key={j}>{renderInline(line)}</div>
        ))}</div>
        {m.table && (
          <div className="cb-table-wrap">
            <table className="cb-table">
              {m.tableHead && <thead><tr>{m.tableHead.map((h, k) => <th key={k}>{h}</th>)}</tr></thead>}
              <tbody>
                {m.table.map((row, k) => (
                  <tr key={k}>
                    {Object.values(row).map((v, kk) => <td key={kk}>{v}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
  };

  const renderInline = (text) => {
    const parts = text.split(/(\*\*[^*]+\*\*)/g);
    return parts.map((p, i) => p.startsWith("**") && p.endsWith("**")
      ? <strong key={i}>{p.slice(2, -2)}</strong>
      : <React.Fragment key={i}>{p}</React.Fragment>
    );
  };

  if (!open) {
    return <button className="cb-launch" onClick={() => setOpen(true)} aria-label="Open chat" title="Ask a question">💬</button>;
  }

  return (
    <div className="cb-panel" role="dialog" aria-label="ToggaBoys Q&A chat">
      <div className="cb-head">
        <span>ToggaBoys Q&amp;A</span>
        <button className="cb-close" onClick={() => setOpen(false)} aria-label="Close chat">✕</button>
      </div>
      <div className="cb-body" ref={scrollRef}>
        {messages.map(renderBubble)}
        {messages.length === 1 && (
          <div className="cb-suggests">
            {examples.map((q, i) => (
              <button key={i} className="cb-chip" onClick={() => ask(q)}>{q}</button>
            ))}
          </div>
        )}
      </div>
      <form className="cb-input" onSubmit={(e) => { e.preventDefault(); ask(); }}>
        <input
          type="text"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          placeholder="Ask anything…"
          autoFocus
        />
        <button type="submit">Send</button>
      </form>
    </div>
  );
}
